<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f6e56">
<title>gzhu课表 · 广州大学研究生课表</title>
<link rel="stylesheet" href="/style.css">
<!-- boot.js 必须在 <head> 里同步执行，不能用 defer：
     登录页与课表页在 HTML 里都带 hidden，显示哪一块由 /api/state 的结果决定。
     但 HTML 解析完成到 app.js 跑起来之间有一段时间，浏览器可能已经渲染过一帧，
     手机上会看到"两套界面同时出现"闪一下。boot.js 在解析阶段就先给 <html> 打上
     标记，让 CSS 把两块都藏住，彻底消掉这一帧。 -->
<script src="/boot.js"></script>
</head>
<!-- 渲染前由 boot.js 给 <html> 打上 js 标记，CSS 借此藏住两块，避免首帧闪烁 -->
<body>

<!-- ============ 登录 ============ -->
<section id="login" class="login-wrap hidden">
  <div class="login-card">
    <div class="brand">
      <div class="logo">课</div>
      <h1>gzhu课表</h1>
      <p class="sub">广州大学研究生课表 · 纯本地</p>
    </div>
    <form id="login-form" autocomplete="on">
      <label class="field">
        <span>学号</span>
        <input id="username" name="username" type="text" inputmode="text" placeholder="请输入学号" autocomplete="username" required>
      </label>
      <label class="field">
        <span>密码</span>
        <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
      </label>
      <label class="remember">
        <input id="remember" type="checkbox" checked>
        <span id="remember-text">同时记住密码（下次免登录）</span>
      </label>
      <p id="saved-hint" class="saved-hint hidden"></p>
      <button id="login-btn" type="submit">登 录</button>
      <p id="login-msg" class="msg"></p>
    </form>
    <p class="tips">账号密码仅用于向学校系统换取课表数据，不会上传到任何第三方。</p>
  </div>
</section>

<!-- ============ 课表 ============ -->
<section id="app" class="app hidden">
  <header class="topbar">
    <div class="who">
      <b id="user-name">同学</b>
      <small id="term-label">—</small>
    </div>
    <button id="logout" class="ghost">退出</button>
  </header>

  <div class="controls">
    <select id="term-select" class="term"></select>
    <div class="week-nav">
      <button id="week-prev" class="step" aria-label="上一周">‹</button>
      <button id="week-cur" class="week-label" title="回到当前周">第 1 周</button>
      <button id="week-next" class="step" aria-label="下一周">›</button>
    </div>
  </div>
  <div id="week-dates" class="week-dates"></div>

  <div id="timetable" class="timetable"></div>

  <!-- 仓库地址 + 构建版本：放在课表**下面**（不固定），
       只有把页面划到底才会看到。
       以前是固定在屏幕底部的，太占视线、也压住了第 11 节。
       版本号是出问题时唯一能确认"装的是哪一次构建"的线索；
       仓库地址做成可点链接，方便装机后自己去拿新版本。
       安卓版里点击由原生交给系统浏览器打开。 -->
  <div class="app-footer">
    <a class="repo-link" href="https://github.com/cc-pro-20/gzhu-grad-schedule"
       target="_blank" rel="noopener">github.com/cc-pro-20/gzhu-grad-schedule</a>
    <p class="build-id">%BUILD_VERSION%</p>
  </div>

  <div id="detail" class="sheet hidden">
    <div class="sheet-mask"></div>
    <div class="sheet-body">
      <h3 id="d-title">课程</h3>
      <dl id="d-list"></dl>
      <button id="d-close" class="ghost wide">关闭</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="loading" class="loading hidden"><span class="spin"></span></div>
</section>

<!-- 仓库地址与构建版本现在放在课表下方（见上面 #app 里），不再固定在屏幕底部。
     这样只有把页面划到底才会看到，不会一直占着视线。 -->

<script src="/app.js"></script>
</body>
</html>
